<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mi Paraiso — No connection</title>
<style>
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg,#1e293b,#0f172a);
  color: #e2e8f0; font: 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; text-align: center; padding: 40px 24px; box-sizing: border-box; }
img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.4); margin-bottom: 18px; }
h1 { font-size: 1.35rem; margin: 0 0 6px; }
p { margin: 0 0 4px; color: #94a3b8; max-width: 340px; }
button { margin-top: 18px; padding: 11px 26px; border: 0; border-radius: 24px; background: linear-gradient(90deg,#ff9a3c,#ff5e62); color: #fff; font: 700 1rem system-ui,sans-serif; cursor: pointer; }
</style>
</head>
<body>
<img src="icon-192.png" alt="">
<h1>No connection · Sin conexión</h1>
<p>Mi Paraiso needs the internet. It will open by itself when you're back online.</p>
<p>Mi Paraiso necesita internet. Se abrirá solo cuando vuelvas a tener conexión.</p>
<button type="button" onclick="go()">Try again · Reintentar</button>
<script>
function go() { location.href = './' + location.search; }
window.addEventListener('online', go);
setInterval(function () { if (navigator.onLine) fetch('./?ping=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (r.ok) go(); }).catch(function () {}); }, 15000);
</script>
</body>
</html>
